name: E2E

# The end-to-end tier (tests/e2e): the built wheel, installed the way users
# install it, driven as separate processes against a stand-in Claude server.
# See CONTRIBUTING.md for what is real and what is simulated.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'  # nightly: timing-sensitive paths get a daily run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: uv sync --locked

      - name: Build and install the wheel
        shell: bash
        run: |
          uv build
          uv tool install dist/*.whl
          bin="$(uv tool dir --bin)/aswap"
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          "$bin" --version
          echo "ASWAP_E2E_BIN=$bin" >> "$GITHUB_ENV"

      # aswap and Claude Code keep credentials in the Keychain on macOS. Each
      # test creates its own unlocked keychain under its temporary HOME
      # (tests/e2e/conftest.py); this one only makes sure nothing that runs
      # with the runner's real HOME can block on an unlock dialog either.
      - name: Temporary keychain (macOS)
        if: runner.os == 'macOS'
        run: |
          kc="$RUNNER_TEMP/aswap-e2e.keychain-db"
          security create-keychain -p "" "$kc"
          security set-keychain-settings "$kc"   # no auto-lock
          security unlock-keychain -p "" "$kc"
          security list-keychains -d user -s "$kc"
          security default-keychain -d user -s "$kc"

      - name: Run e2e tests
        shell: bash
        env:
          ASWAP_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        # faulthandler dumps every thread's stack if a test hangs for 5 min.
        run: uv run pytest -m e2e tests/e2e -n auto -o faulthandler_timeout=300 --durations=25

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: ignore

  # The real Claude Code CLI, pointed at the fake, must send the bearer token
  # of the account aswap switched to (tests/e2e/test_claude_code.py). It
  # installs the latest Claude Code, which aswap does not control, so a red
  # run here is a signal to look, not a merge blocker.
  claude-code:
    name: e2e with the real Claude Code (ubuntu, allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: uv sync --locked

      - name: Build and install the wheel
        run: |
          uv build
          uv tool install dist/*.whl
          echo "ASWAP_E2E_BIN=$(uv tool dir --bin)/aswap" >> "$GITHUB_ENV"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
          echo "ASWAP_E2E_REAL_CLAUDE=$(command -v claude)" >> "$GITHUB_ENV"

      - name: Run the Claude Code e2e test
        env:
          ASWAP_E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: uv run pytest -m e2e tests/e2e/test_claude_code.py -n 0 -v -rs

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-claude-code
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: ignore
