name: Release

# Push a tag like v1.2.0 (matching `version` in pyproject.toml) to build the
# package and publish a GitHub release with the sdist and wheel attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Run tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "aswap $GITHUB_REF_NAME" --generate-notes --verify-tag
